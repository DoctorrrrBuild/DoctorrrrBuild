name: Build Doctor Docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug — List repo structure
        run: |
          echo "=== Repository Root ==="
          ls -la
          echo "=== docs/ folder ==="
          ls -la docs/ 2>/dev/null || echo "docs/ does not exist yet"
          echo "=== Python version ==="
          python --version

      - name: Compile Doctor files
        id: compile
        run: |
          echo "=== Running doctor.py ==="
          python doctor.py
        continue-on-error: true

      - name: Fallback — Check if _site exists
        if: steps.compile.outcome == 'failure'
        run: |
          echo "=== Compilation failed, checking state ==="
          ls -la _site/ 2>/dev/null || echo "_site does not exist"
          echo "=== Attempting recovery build ==="
          mkdir -p _site
          python doctor.py || echo "Recovery also failed"

      - name: Verify output
        run: |
          echo "=== _site contents ==="
          ls -la _site/
          echo "=== Checking for index.html ==="
          test -f _site/index.html && echo "index.html exists" || echo "index.html MISSING"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
