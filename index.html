<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Optician</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 600px;
      margin: 80px auto;
      padding: 20px;
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 { font-size: 3em; margin: 0; }
    p { color: #666; font-size: 1.2em; }
    a {
      display: inline-block;
      margin-top: 20px;
      margin-right: 10px;
      padding: 12px 24px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    .built-with {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85em;
      color: #888;
    }
    .built-with img {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1>Optician by Doctor</h1>
  <p>The official landing page generator for the document site langauge, Doctor.</p>
  <a href="./docs/">Read Docs</a>
  <a href="https://github.com/DoctorrrrBuild">GitHub Profile</a>

  <div class="built-with">
    <span>Built with Optician</span>
    <img src="https://raw.githubusercontent.com/DoctorrrrBuild/DoctorrrrBuild/main/logo.png" alt="Optician logo">
  </div>

</html>
